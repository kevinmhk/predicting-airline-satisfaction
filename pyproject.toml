[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"compare.py" = ["E402"]
"lightgbm_experiment.py" = ["E402"]
"blend_experiment.py" = ["E402"]
"feature_experiment.py" = ["E402"]
"train.py" = ["E402"]
"longer_catboost.py" = ["E402"]
"slower_learning.py" = ["E402"]
"categorical_ratings.py" = ["E402"]
"source_augmentation.py" = ["E402"]
"weighted_blend_experiment.py" = ["E402"]
"random_forest_experiment.py" = ["E402"]
"catboost_seed_average.py" = ["E402"]
"five_fold_cv.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_configs = true
